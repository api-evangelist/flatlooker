name: Flatlooker
description: >-
  Flatlooker (founded 2016) is a French digital real-estate agency for online rental search, tenant
  placement, and full rental property management (gestion locative). It now operates under the Manda
  brand (formerly Flatlooker and Hello Syndic); flatlooker.com redirects to manda.fr. Manda covers
  rental and property management, sales, condominium (syndic) management, and energy renovation for
  owners, tenants, investors, and co-ownerships across France, working primarily online — remote
  viewings, electronic dossiers and signatures, and mobile apps to track properties in real time —
  while relying on local agents in Paris, Lyon, and Marseille. Flatlooker was surfaced as a Partech
  portfolio company. It publishes no public developer API; this profile captures its live llms.txt
  and probed domain-security posture.
